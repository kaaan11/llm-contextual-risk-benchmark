[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-usability-benchmark"
version = "0.2.0"
description = "A pre-registered pilot study on contextual risk interpretation in large language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
providers = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q -p no:cacheprovider"
